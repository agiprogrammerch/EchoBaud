version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "agiprogrammerch"
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      numpy-scipy:
        patterns:
          - "numpy"
          - "scipy"
        update-types:
          - "minor"
          - "patch"
      security-crypto:
        patterns:
          - "cryptography"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "pytest*"
          - "reedsolo"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"